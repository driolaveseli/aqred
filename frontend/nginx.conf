server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app — hand every unknown path back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Let hashed build assets cache hard
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
